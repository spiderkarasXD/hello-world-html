name: Vibe MIDI APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        run: gradle -p android assembleDebug --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk VibeMidi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VibeMidi
          path: VibeMidi.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete vibe-midi-latest --yes --cleanup-tag || true
          gh release create vibe-midi-latest VibeMidi.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Vibe MIDI (свежая сборка)" \
            --notes "Сборка из ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Скачайте VibeMidi.apk на телефон и установите."
